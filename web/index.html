<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mall Maniacs</title>
    <style>
      :root { --bg: #111; --panel: rgba(16, 16, 20, 0.86); --text: #f2f2f2; --accent: #e3262b; --muted: #9a9aa2; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      .panel { position: fixed; background: var(--panel); border-radius: 8px; padding: 12px 14px; }
      #hud { bottom: 12px; right: 12px; font-size: 11px; color: var(--muted); max-width: calc(100vw - 48px); text-align: right; padding: 6px 10px; }
      #app .hud2d { position: absolute; inset: 0; pointer-events: none; }
      #hud b { color: var(--text); }
      #hud .list { list-style: none; margin: 4px 0 0; padding: 0; columns: 2; column-gap: 16px; }
      #hud .list li.done { color: #6fd36f; }
      #hud .hint { margin-top: 6px; color: #ffd400; }
      #hud .results { margin-top: 6px; color: var(--text); }
      #status { bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); }
      .retro canvas { image-rendering: pixelated; }
      #quiz { left: 50%; bottom: 14%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); text-align: center; font-size: 20px; border: 2px solid #ffd400; }
      #quiz .q { color: var(--text); margin-bottom: 8px; }
      #quiz .keys { color: #ffd400; font-size: 16px; }
      #pickup { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; image-rendering: auto; }
      .retro #pickup, #pickup.retro { image-rendering: pixelated; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel hidden"></div>
    <div id="status" class="panel hidden"></div>
    <div id="quiz" class="panel hidden"></div>
    <img id="pickup" class="hidden" alt="" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
